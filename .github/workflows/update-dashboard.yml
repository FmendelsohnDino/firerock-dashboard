name: Update Dashboard Data

# Fires when a new daily report ZIP is uploaded, or when the converter / extractor
# / trend base change. The bot's own data.json + sales_report.xlsx commits are NOT
# in this list, so they can't retrigger the workflow (no loops).
on:
  push:
    paths:
      - 'daily_report.zip'      # the two daily PDFs, zipped, from the uploader
      - 'pdf_to_report.py'      # the PDF -> xlsx converter
      - 'extract_data.py'       # the xlsx -> data.json extractor
      - 'trend_base.xlsx'       # master export used only for the Jan-May trend
  workflow_dispatch:            # lets you run it manually from the Actions tab

permissions:
  contents: write               # needed so the job can commit data/data.json

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # openpyxl reads/writes the Excel; pdfplumber reads the PDFs.
      - name: Install dependencies
        run: pip install openpyxl pdfplumber

      # If the ZIP isn't present (e.g. a code-only push), skip cleanly.
      - name: Check for daily report
        id: check
        run: |
          if [ -f daily_report.zip ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No daily_report.zip present — nothing to convert. Skipping."
          fi

      # Step 1: turn the two daily PDFs into a schema-correct sales_report.xlsx.
      # --zip auto-detects which PDF is the dashboard and which is the order summary,
      # so the filenames inside the ZIP don't matter. The converter exits non-zero
      # if any total fails to cross-foot, which fails the run instead of shipping
      # bad numbers.
      - name: Convert PDFs -> sales_report.xlsx
        if: steps.check.outputs.exists == 'true'
        run: python pdf_to_report.py --zip daily_report.zip --base trend_base.xlsx --out sales_report.xlsx

      # Step 2: unchanged — read the xlsx into data/data.json.
      - name: Extract data
        if: steps.check.outputs.exists == 'true'
        run: python extract_data.py sales_report.xlsx

      - name: Commit updated data
        if: steps.check.outputs.exists == 'true'
        run: |
          git config user.name  "FireRock Dashboard Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/data.json sales_report.xlsx
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto-update dashboard $(date -u '+%Y-%m-%d %H:%M') UTC"
            git push
          fi
